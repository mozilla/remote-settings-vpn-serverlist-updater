[project]
name = "rs-script"
version = "0.1.0"
description = "Sync the Fastly VPN locations into the vpn-serverlist Remote Settings collection"
license = {text = "MPLv2"}
requires-python = "<4.0,>=3.12"
dependencies = [
    "jsonschema<5.0.0,>=4.26.0",
    "kinto-http<12.0.0,>=11.8.0",
    "pycountry<27.0.0,>=26.2.16",
    "sentry-sdk<3.0.0,>=2.29.1",
]

[dependency-groups]
dev = [
    "pytest<9.0.0,>=8.4.0",
    "ruff<1.0.0,>=0.11.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 99
extend-exclude = [
    "__pycache__",
    ".venv/",
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E", "W",
    # flake8
    "F",
    # isort
    "I",
]
ignore = [
    # `format` will wrap lines.
    "E501",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
